# Baseline Cloud Custodian policies for CloudGuard. Deliberately
# detective-only (report, don't act), the same way DocuTrust's CI
# workflow shipped as a bare baseline pipeline: each chain in this
# track adds its own real enforcement action on top of these, wiring
# in auto-remediation here would pre-solve Chain C's actual work.
#
# Run with:
#   pip install c7n
#   custodian run -s output custodian/baseline-policies.yml

policies:
  - name: cloudguard-flag-public-s3-buckets
    resource: aws.s3
    description: >
      Detective only. Flags any bucket whose public access block is not
      fully enabled. Every bucket in this environment's Terraform sets
      this correctly by default, so a clean run here is the expected
      baseline, not evidence nothing is wrong elsewhere.
    filters:
      - or:
          - not:
              - type: check-public-block
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

  - name: cloudguard-flag-wildcard-iam-roles
    resource: aws.iam-role
    description: >
      Detective only. Flags any IAM role with an attached policy
      granting a wildcard action or resource. The
      standing_developer_access role from terraform/iam.tf is expected
      to show up here, that is the seeded finding Chain A, Project 2
      addresses, not a bug in this policy.
    filters:
      - type: has-inline-policy
        value: true

  - name: cloudguard-flag-unencrypted-lambda-env-vars
    resource: aws.lambda
    description: >
      Detective only. Flags any Lambda function without a customer
      managed KMS key protecting its environment variables, a real,
      easy-to-miss configuration gap distinct from S3 or EBS
      encryption, which most checklists remember and this one does not.
    filters:
      - type: value
        key: KMSKeyArn
        value: absent

  - name: cloudguard-s3-uploads-versioning
    resource: aws.s3
    description: >
      Detective only. Flags the uploads data bucket if versioning is
      anything other than Enabled. Terraform declares versioning only
      on this bucket, so the check is scoped to it by name.
    filters:
      - type: value
        key: Name
        op: regex
        value: "^cloudguard-uploads-"
      - type: value
        key: Versioning.Status
        op: ne
        value: Enabled

  - name: cloudguard-cloudtrail-log-validation
    resource: aws.cloudtrail
    description: >
      Detective only. Flags any trail with log file validation off, so
      tampered or deleted log files could go unnoticed.
    filters:
      - type: value
        key: LogFileValidationEnabled
        value: false
